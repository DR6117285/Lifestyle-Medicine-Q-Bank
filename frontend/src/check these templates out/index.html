{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="header">
        <h1>Lifestyle Medicine Question Bank</h1>
        <p class="subtitle">Welcome to your study companion</p>
    </div>
    <div class="start-container">
        <a href="{{ url_for('home') }}" class="start-btn">Enter Question Bank</a>

    window.setTimeout(function() {
        window.location.href = "{{ url_for('home') }}";
    }, 100);
</script>
{% endblock %}
