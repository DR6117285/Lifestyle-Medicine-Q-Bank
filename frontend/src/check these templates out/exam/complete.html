{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="exam-complete">
        <h1>Exam Complete</h1>
        <div class="exam-results">
            <p>Questions Answered: {{ total_answered }} / {{ total_questions }}</p>
            <p>Correct Answers: {{ total_correct }}</p>
            <p>Final Score: {{ (total_correct / total_questions * 100)|round(1) }}%</p>
        </div>
        <div class="action-buttons">
            <a href="{{ url_for('home') }}" class="btn-primary">Return Home</a>
            <a href="{{ url_for('show_incorrect_answers') }}" class="btn-secondary">Review Incorrect Answers</a>
        </div>
    </div>
</div>
{% endblock %}
