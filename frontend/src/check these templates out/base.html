<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifestyle Medicine Question Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        // Time tracking functionality
        let startTime;
        let questionId;

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize time tracking
            startTime = new Date();
            questionId = document.querySelector('form')?.dataset.questionId;

            // Add event listener for form submission
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function() {
                    saveTimeSpent();
                });
            }

            // Add event listeners for navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    saveTimeSpent();
                });
            });

            // Initialize radio button handlers
            const options = document.querySelectorAll('.options div');
            const submitButton = document.querySelector('.submit-btn');
            
            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove active class from all options
                    options.forEach(opt => opt.classList.remove('active'));
                    // Add active class to clicked option
                    this.classList.add('active');
                    // Enable submit button if it exists
                    if (submitButton) {
                        submitButton.disabled = false;
                    }
                });
            });
        });

        function saveTimeSpent() {
            if (!startTime || !questionId) return;
            
            const endTime = new Date();
            const timeSpent = (endTime - startTime) / 1000; // Convert to seconds
            
            fetch('/api/save-time', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    question_id: questionId,
                    time_spent: timeSpent
                })
            });
        }

        // Progress bar animation
        document.addEventListener('DOMContentLoaded', function() {
            const progressBars = document.querySelectorAll('.progress-fill');
            progressBars.forEach(bar => {
                const percentage = bar.getAttribute('percentage');
                bar.style.width = `${percentage}%`;
            });
        });
    </script>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
