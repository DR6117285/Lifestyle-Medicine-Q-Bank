_format_version: "1.1"

###
### Kong Gateway Configuration for Supabase Local Development
### This configuration routes all Supabase services through the Kong Gateway
###

###
### Consumers
###
consumers:
  - username: anon
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  - username: service_role
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

###
### Access Control Lists
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: anon
  - consumer: service_role
    group: service_role

###
### Services (API Definitions)
###
services:
  ###
  ### PostgREST API
  ###
  - name: rest-v1
    url: http://supabase-rest:3000/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - service_role

  ###
  ### GoTrue Auth API  
  ###
  - name: auth-v1
    url: http://supabase-auth:9999/
    plugins:
      - name: cors
      - name: request-transformer
        config:
          remove:
            headers:
              - Authorization
          add:
            headers:
              - Authorization:Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

  ###
  ### Realtime API
  ###
  - name: realtime-v1
    url: http://supabase-realtime:4000/socket
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - service_role

  ###
  ### Storage API
  ###
  - name: storage-v1
    url: http://supabase-storage:5000/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false

  ###
  ### PostgREST Meta API
  ###
  - name: meta
    url: http://supabase-meta:8080/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - service_role

###
### Routes (URL Routing)
###
routes:
  ###
  ### PostgREST API Routes
  ###
  - service: rest-v1
    paths:
      - "/rest/v1/"
    strip_path: true
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

  ###
  ### Auth API Routes
  ###
  - service: auth-v1
    paths:
      - "/auth/v1/"
    strip_path: true
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

  ###
  ### Realtime API Routes
  ###
  - service: realtime-v1
    paths:
      - "/realtime/v1/"
    strip_path: true
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

  ###
  ### Storage API Routes
  ###
  - service: storage-v1
    paths:
      - "/storage/v1/"
    strip_path: true
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

  ###
  ### Meta API Routes (for Supabase Studio)
  ###
  - service: meta
    paths:
      - "/pg/"
    strip_path: true
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS